name: Android signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'milkyway/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Select next Android version
        run: |
          VERSION_CODE=$(node -p "JSON.parse(require('node:fs').readFileSync('milkyway/download/version.json', 'utf8')).versionCode + 1")
          echo "ANDROID_RELEASE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_VERSION_NAME=$VERSION_CODE.0.0" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npx cap add android

      - name: Prepare release signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || (echo "Missing ANDROID_RELEASE_KEYSTORE_BASE64 Actions secret" >&2; exit 1)
          test -n "$ANDROID_RELEASE_STORE_PASSWORD" || (echo "Missing ANDROID_RELEASE_STORE_PASSWORD Actions secret" >&2; exit 1)
          test -n "$ANDROID_RELEASE_KEY_ALIAS" || (echo "Missing ANDROID_RELEASE_KEY_ALIAS Actions secret" >&2; exit 1)
          test -n "$ANDROID_RELEASE_KEY_PASSWORD" || (echo "Missing ANDROID_RELEASE_KEY_PASSWORD Actions secret" >&2; exit 1)
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/milkyway-release.keystore"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/milkyway-release.keystore" >> "$GITHUB_ENV"

      - name: Prepare native Android build
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: node tools/prepare-capacitor-android.mjs

      - name: Assemble signed release APK
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ env.ANDROID_RELEASE_KEYSTORE_PATH }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        working-directory: android/capacitor
        run: ./gradlew assembleRelease

      - name: Publish APK artifact
        run: |
          mkdir -p milkyway/download
          cp android/capacitor/app/build/outputs/apk/release/app-release.apk milkyway/download/MilkyWay.apk

      - name: Update APK metadata
        run: node tools/publish-android-version.mjs

      - name: Commit generated Android project and APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android milkyway/download/version.json milkyway/download/MilkyWay.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish signed Android APK"
            git push
          fi
